<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Study Planner - Create personalized study schedules to improve academic performance and reduce stress.">
    <meta name="keywords" content="study planner, exam registration, time management, study materials, progress tracking">
    <title>Smart Study Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background-color: #121212;
            color: #fff;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        body[data-dark-mode="true"] {
            background-color: #1c1c1c;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        nav {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }

        nav .nav-btn {
            display: inline-block;
            width: 40px;
            height: 40px;
            background-color: #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        nav .nav-btn:hover {
            transform: scale(1.1);
        }

        nav .nav-btn:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-style: solid;
            border-width: 0 15px 15px 0;
            border-color: transparent transparent #fff transparent;
            width: 0;
            height: 0;
        }

        nav .nav-btn:after {
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        nav .nav-btn:hover:after {
            opacity: 1;
        }

        nav .nav-btn:active {
            transform: scale(0.9);
        }

        h1 {
            font-weight: 600;
            font-size: 36px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: 300;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .hero {
            position: relative;
            background-color: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero .cta-btn {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
        }

        .hero .cta-btn:hover {
            background-color: #0056b3;
        }

        .hero .cta-btn:active {
            transform: scale(0.9);
        }

        .hero h1 {
            font-weight: 600;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero h2 {
            font-weight: 300;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .features {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            position: relative;
        }

        .feature-card {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feature-card h3 {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .feature-card p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .feature-card:hover {
            transform: translateY(-20px);
            box-shadow: 0 20px 20px rgba(0, 0, 0, 0.1);
        }

        .how-it-works {
            padding: 20px;
            background-color: #000;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
        }

        .how-it-works .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .how-it-works .step h4 {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .how-it-works .step p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .email-form {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .email-form .input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: none;
            background-color: #333;
            border-radius: 10px;
        }

        .email-form .btn {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
        }

        .email-form .btn:hover {
            background-color: #0056b3;
        }

        .email-form .btn:active {
            transform: scale(0.9);
        }

        .email-form .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #fff;
            animation: loading 1s linear infinite;
        }

        .email-form .success {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #fff;
            animation: success 1s linear infinite;
        }

        .email-form .success::before {
            content: "\2713";
            font-size: 24px;
            color: #fff;
        }

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
        }

        .footer .social {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }

        .footer .social a {
            margin-right: 10px;
            font-size: 24px;
            color: #fff;
            transition: color 0.3s ease;
        }

        .footer .social a:hover {
            color: #007bff;
        }

        .footer p {
            font-size: 16px;
            margin-bottom: 10
