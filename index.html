<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="title" content="Smart Study Planner - Manage Your Exams Stresslessly">
<meta name="description" content="Personalized study schedule generator for students">
<title>Smart Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Outfit', sans-serif;
  background-color: #212121;
  transition: background-color 150ms ease-in-out;
  color: #ccc;
}

.header {
  background-image: linear-gradient(to bottom, #1A1D23, #212121);
  backdrop-filter: blur(10px);
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 2rem;
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 2.5rem;
  color: #fff;
  font-family: 'Inter', sans-serif;
  margin-bottom: 0.5rem;
}

.hero p {
  font-size: 1.5rem;
}

.cta {
  background-color: #3B5998;
  color: #fff;
  padding: 1rem 2rem;
  border: none;
  border-radius: 0.5rem;
  cursor: pointer;
  user-select: none;
  transition: background-color 150ms ease-in-out, border-color 150ms ease-in-out;
}

.cta:hover {
  background-color: #4B69B8;
  border: 1px solid #3e3e3e;
}

.footer {
  position: absolute;
  bottom: 0;
  width: 100%;
  background-color: #212121;
  padding: 1rem;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
}

.features {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1;
  gap: 2rem;
  padding: 2rem;
  justify-content: center;
  align-items: center;
}

.feature {
  width: 25vw;
  height: 20vh;
  background-image: linear-gradient(to bottom, #1A1D23, #212121);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 1rem;
  border-radius: 0.5rem;
  transition: box-shadow 150ms ease-in-out;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}

.feature h2 {
  color: #fff;
  margin-bottom: 0.5rem;
  font-size: 1.25rem;
  font-family: 'Inter', sans-serif;
}

.step {
  position: relative;
  background-color: #333;
  border-radius: 0.5rem;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  width: 25vw;
  height: 20vh;
  transition: background-color 150ms ease-in-out;
}

.step-icon {
  position: absolute;
  top: 1rem;
  width: 2rem;
  height: 2rem;
  background-color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  transition: background-color 150ms ease-in-out;
}

.sign-up {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2rem;
  background-color: #333;
  border-radius: 0.5rem;
  margin: 0 auto;
  width: 40vw;
  transition: background-color 150ms ease-in-out;
}

.sign-up input[type="email"] {
  width: 70%;
  padding: 1rem;
  border: none;
  border-radius: 0.5rem;
  font-size: 1rem;
  font-family: 'Open Sans', sans-serif;
}

button[type="submit"] {
  background-color: #3B5998;
  color: #fff;
  padding: 0.5rem 1rem;
  border: none;
  border-radius: 0.5rem;
  cursor: pointer;
  user-select: none;
  transition: background-color 150ms ease-in-out;
}

button[type="submit"]:hover {
  background-color: #4B69B8;
}

.card-lift {
  transform: translateY(-10px);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}

.card-glow {
  animation: glow 150ms;
}

@keyframes glow {
  0% {
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }
  100% {
    box-shadow: 0 0 10px rgba(255, 255, 255, 0);
  }
}

.pulse {
  animation: pulse 1500ms infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

.animate {
  animation: animate 1500ms infinite;
}

@keyframes animate {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(5px, 5px);
  }
  100% {
    transform: translate(0, 0);
  }
}

@media (max-width: 1200px) {
  .features {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 1000px) {
  .features {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 500px) {
  .hero h1 {
    font-size: 2rem;
  }
  .hero p {
    font-size: 1rem;
  }
  .card-lift {
    transform: none;
  }
}

.email-signup {
  position: relative;
  padding-top: 2rem;
}

.email-signup::before {
  content: "";
  position: absolute;
  top: 0.5rem;
  left: calc(50% - 16px);
  width: 32px;
  height: 32px;
  background-color: #333;
  border-radius: 50%;
}

.email-signup input[type="email"] {
  padding-left: 44px;
}

.email-sign-up-loading {
  position: absolute;
  top: 0.5rem;
  left: calc(50% - 10px);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid #fff;
  border-top: none;
  animation: spinner 1.5s linear infinite;
}

.email-sign-up-loading::before, .email-sign-up-loading::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid #fff;
  border-top: none;
  animation: spinner 1.5s linear infinite;
}

.email-sign-up-loading::after {
  transform: rotate(120deg);
}

.email-sign-up-loading::before {
  transform: rotate(240deg);
}

.email-sign-up-success {
  position: absolute;
  top: 0.5rem;
  left: calc(50% - 8px);
  opacity: 0;
  transition: opacity 150ms ease-in-out;
  color: #3B5998;
}

.email-sign-up-success-show {
  opacity: 1;
}
</style>
</head>

  </div>
</div>
