<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Study Planner that auto-generates personalized study schedules for students.">
  <meta name="keywords" content="Smart Study Planner, personalized study schedules, exam deadlines, learning resources">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ruslan+Display:wght@400;600&display=swap">
  <title>Smart Study Planner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display:wght@400;600&display=swap');
    :root {
      --primary-color: #3B4352;
      --secondary-color: #8F9AA5;
      --dark-color: #2F343F;
      --light-color: #F9FAFA;
      --accent-color: #F7D2C4;
    }
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      background-color: var(--dark-color);
      color: var(--light-color);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    .glassmorphisms {
      backdrop-filter: blur(5px);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.15);
    }
    .glassmorphisms .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3B4352;
    }
    .glassmorphisms .header .logo {
      font-size: 24px;
      font-family: 'Ruslan Display', sans-serif;
      text-decoration: none;
      color: var(--primary-color);
    }
    .glassmorphisms .header .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .glassmorphisms .header .nav-bar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .glassmorphisms .header .nav-bar ul li {
      display: inline-block;
      margin-right: 20px;
    }
    .glassmorphisms .header .nav-bar ul li a {
      text-decoration: none;
      color: var(--light-color);
      font-size: 14px;
    }
    .glassmorphisms .header .nav-bar ul li a:hover {
      text-decoration: underline;
    }
    .featured-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 80%;
      margin: 0 auto;
    }
    .features .feature {
      background-color: var(--dark-color);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .features .feature:hover {
      transform: translateY(-10px);
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
    }
    .features .feature .content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .features .feature .content h2 {
      color: var(--primary-color);
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .features .feature .content p {
      color: var(--light-color);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .how-it-works {
      max-width: 80%;
      margin: 0 auto;
    }
    .how-it-works .step {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .how-it-works .step .number {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary-color);
    }
    .how-it-works .step .title {
      font-size: 18px;
      font-weight: bold;
      color: var(--light-color);
      margin-bottom: 10px;
    }
    .how-it-works .step .description {
      font-size: 14px;
      color: var(--light-color);
    }
    .email-signup {
      max-width: 80%;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
      background-color: var(--dark-color);
      box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.2);
    }
    .email-signup form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .email-signup input[type="email"] {
      padding: 10px;
      border: none;
      border-radius: 10px;
      width: 80%;
      font-size: 16px;
    }
    .email-signup input[type="submit"] {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: var(--accent-color);
      color: var(--light-color);
      font-size: 16px;
      cursor: pointer;
    }
    .email-signup input[type="submit"]:hover {
      background-color: #FFB480;
    }
    .footer {
      max-width: 80%;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
      background-color: var(--dark-color);
      box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.2);
    }
    .footer .socials {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer .socials a {
      text-decoration: none;
      color: var(--light-color);
      font-size: 16px;
      margin-right: 20px;
    }
  </style>
</head>
<body>

    <div class="header">
      <div class="logo"><a href="#" style="font-size: 24px; font-family: 'Ruslan Display', sans-serif; text-decoration: none; color: var(--primary-color); transform: translateX(5px); transition: transform 0.2s ease-in-out;">Smart Study Planner</a></div>
      <div class="nav-bar">
        <ul>
          <li><a href="#" style="text-decoration: none; color: var(--light-color); font-size: 14px;">Home</a></li>
          <li><a href="#" style="text-decoration: none; color: var(--light-color); font-size: 14px;">Features</a></li>
          <li><a href="#" style="text-decoration: none; color: var(--light-color); font-size: 14px;">How It Works</a></li>
        </ul>
      </div>
      <button class="cta-button" style="background-color: var(--accent-color); color: var(--light-color); font-size: 16px; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; transition: background-color 0.2s ease-in-out;">Sign Up</button>
    </div>
  </header>
  <main>
    <section class="hero">
      <h1 style="font-size: 48px; font-weight: bold; color: var(--primary-color); margin-top: 10px;">Smart Study Planner</h1>
      <h2 style="font-size: 24px; color: var(--light-color); margin-bottom: 20px;">Auto-generate personalized study schedules for students based on exam deadlines.</h2>
      <button class="cta-button" style="background-color: var(--accent-color); color: var(--light-color); font-size: 16px; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; transition: background-color 0.2s ease-in-out;">Get Started</button>
    </section>
    <section class="features">
      <div class="feature">
        <div class="content">
          <h2 style="font-size: 18px; color: var(--primary-color); font-weight
