<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <meta name="description" content="Create personalized study schedules to reduce stress and improve academic performance">
    <meta name="keywords" content="Smart Study Planner, Study Schedules, Academic Performance">
    <meta name="author" content="Your Name">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Smart Study Planner">
    <meta property="og:description" content="Create personalized study schedules to reduce stress and improve academic performance">
    <meta property="og:image" content="https://example.com/smart-study-planner-image.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #fff;
            background-color: #141414;
            overflow-x: hidden;
        }
        
        .glassmorpheim {
            position: relative;
            backdrop-filter: blur(20px);
            background-color: #222;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.2s ease-in-out;
        }
        
        .glassmorpheim:hover {
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
        }
        
        .glassmorpheim button:hover {
            animation: pulse 0.4s ease-in-out forwards;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            }
        }
        
        .hero {
            background-color: #1b1b1b;
            padding: 2rem;
            text-align: center;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-image: linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.8));
            backdrop-filter: blur(20px);
        }
        
        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .hero h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 2rem;
        }
        
        .hero .cta {
            background-color: #ff69b4;
            color: #333;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        
        .hero .cta:hover {
            background-color: #ff33cc;
        }
        
        .hero .cta img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 1rem;
            filter: grayscale(1);
        }
        
        @media (max-width: 768px) {
            .hero {
                height: 80vh;
            }
        }
        
        @media (max-width: 576px) {
            .hero {
                height: 60vh;
            }
        }
        
        .features {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }
        
        .feature {
            background-color: #222;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.2s ease-in-out;
        }
        
        .feature:hover {
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
        }
        
        .feature h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .feature p {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 2rem;
        }
        
        .how-it-works {
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .step {
            background-color: #222;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.2s ease-in-out;
        }
        
        .step:hover {
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
        }
        
        .step h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .step p {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 2rem;
        }
        
        .sign-up {
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .sign-up h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .sign-up form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .sign-up input {
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            margin-bottom: 2rem;
        }
        
        .sign-up button {
            background-color: #ff69b4;
            color: #333;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        
        .sign-up button:hover {
            background-color: #ff33cc;
        }
        
        .success-message {
            display: none;
            padding: 1rem;
            border-radius: 10px;
            background-color: #222;
            color: #fff;
        }
        
        .success-message.success {
            display: block;
        }
        
        .footer {
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .footer p {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 2rem;
        }
        
        .footer a {
            text-decoration: none;
            color: #fff;
        }
        
        .footer a:hover {
            color: #ff69b4;
        }
    </style>
</head>
<body>
    <header>
        <nav class="nav">
            <a href="#" class="logo">Smart Study Planner</a>
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#how_it_works">How It Works</a></li>
                <li><a href="#sign_up">Sign Up</a></li>
            </ul>
            <button id="nav-toggle" class="toggle-nav">
                <i class="fas fa-bars"></i>
            </button>
        </nav>
        <div class="hero" id="hero">
            <h1>Smart Study Planner</h1>
            <h2>Create personalized study schedules to reduce stress and improve academic performance</h2>
            <button class="cta">
                <img src="assets/user.png" alt="User Icon">
                Sign Up for Free!
            </button>
        </div>
    </header>
    <main>
        <div class="features" id="features">
            <div class="feature">
                <h2>Exam Calendar Integration</h2>
                <p>Input exam
