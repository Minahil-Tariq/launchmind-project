<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Study Planner</title>
  <meta name="description" content="Auto-generate tailored study schedules based on exam deadlines">
  <meta name="author" content="Elite UI/UX Engineer">
  <meta name="keywords" content="Study Planner, Exam Preparation">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    :root {
      --dark-indigo: #2A2353;
      --neon-green: #36D7B7;
      --dark-blue: #1E1E1E;
      --light-gray: #9A9A9A;
      --accent-green: #34C759;
      --footer-gray: #3C3C3C;
      --background-white: #F9F9F9;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background-color: var(--background-white);
      color: var(--dark-blue);
      transition: background-color 0.2s ease;
    }
    body.dark-mode {
      background-color: var(--dark-indigo);
      color: var(--neon-green);
    }
    .backdrop {
      background-color: var(--dark-indigo);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease-out;
    }
    .backdrop:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      -webkit-box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .card {
      padding: 2rem;
      border-radius: 0.5rem;
      background-color: var(--dark-blue);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      -webkit-box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .card h2 {
      color: var(--neon-green);
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem;
      gap: 2rem;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 600;
      color: var(--neon-green);
    }
    .hero p {
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--light-gray);
    }
    .hero button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      background-color: var(--accent-green);
      color: var(--dark-blue);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .hero button:hover {
      background-color: var(--dark-green);
      color: var(--light-gray);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
      gap: 2rem;
    }
    .features .card {
      padding: 2rem;
    }
    .features .card h2 {
      color: var(--neon-green);
    }
    .how-it-works {
      padding: 5rem;
      text-align: center;
    }
    .how-it-works .step {
      padding: 2rem;
      background-color: var(--dark-indigo);
      border-radius: 0.5rem;
      display: inline-block;
      width: 10rem;
      height: 10rem;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease-out;
    }
    .how-it-works .step:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .how-it-works .step p {
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--light-gray);
      margin-bottom: 2rem;
    }
    .how-it-works .step span {
      font-size: 3rem;
      font-weight: 600;
      color: var(--neon-green);
    }
    .email-signup {
      padding: 5rem;
      text-align: center;
    }
    .email-signup form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .email-signup form input[type='email'] {
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      background-color: var(--light-gray);
      color: var(--dark-blue);
      font-size: 1.2rem;
      cursor: text;
    }
    .email-signup form button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      background-color: var(--accent-green);
      color: var(--dark-blue);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .email-signup form button:hover {
      background-color: var(--dark-green);
      color: var(--light-gray);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .email-signup span {
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--light-gray);
      margin-bottom: 2rem;
    }
    .email-signup .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      animation: loader 1s linear;
    }
    @keyframes loader {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
    .loader-success {
      margin-bottom: 2rem;
      width: 4rem;
      height: 1rem;
      background-color: var(--accent-green);
      animation: loader-success 1s linear;
    }
    @keyframes loader-success {
      0% {
        width: 1rem;
      }
      100% {
        width: 4rem;
      }
    }
    .footer {
      padding: 5rem;
      background-color: var(--footer-gray);
      text-align: center;
    }
    .footer p {
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--light-gray);
    }
    .footer a {
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--neon-green);
      text-decoration: none;
    }
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }
      .hero p {
        font-size: 1rem;
        padding: 1rem;
      }
      .features {
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      }
      .features .card {
        padding: 1rem;
      }
      .how-it-works .step {
        width: 8rem;
        height: 8rem;
      }
      .how-it-works .step p {
        font-size: 1.2rem;
      }
      .email-signup form button {
        padding: 0.5rem 1rem;
      }
      .footer p {
        font-size: 1rem;
      }
    }
    @media (max-width: 480px) {
      .hero h1 {
        font-size: 1.5rem;
      }
      .hero p {
