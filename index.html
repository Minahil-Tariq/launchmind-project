<!DOCTYPE html>
<html lang="en">

	<meta charset="UTF-8">

	<meta name="theme-color" content="#2A2B40">

	<style>
		* {

			align-items: center;

		}
		
		.herosection button {

			color: #F7F7F7;

			padding: 15px 30px;
			cursor: pointer;
			border-radius: 5px;
			box-shadow: 0 0 10px #3B4161;

		}
		
		.herosection button:hover {

		}
		
		.feature-icon {
			background-color: #F7F7F7;

		.how-it-works {

			transition: all 0.2s ease;
		}
		
		.step:hover {

			box-shadow: 0 0 20px #3B4161;
		}
		
		.step-number {
			background-color: #F7F7F7;
			padding: 10px 20px;
			border-radius: 50%;
			margin: 10px;
			display: inline-block;

		.step-number:hover {

			box-shadow: 0 0 20px #3B4161;
		}
		
		.step-icon {

			padding: 20px;
			text-align: center;
			border-radius: 50%;
			margin: 20px auto;
			transition: all 0.2s ease;
		}
		
		.step-icon img {
			width: 60px;
			height: 60px;
			object-fit: contain;
		}
		
		.step-icon:hover {
			background-color: #3B4161;
			box-shadow: 0 0 20px #3B4161;
		}
		
		.email-signup {
			margin: 100px auto 0;
		}
		
		.email-signup h2 {
			margin: 20px 0;
		}
		
		.email-signup input[type="email"] {
			padding: 15px;
			margin: 20px 0;
			padding-bottom: 15px;
			transition: all 0.2s ease;
		}
		
		.email-signup input[type="email"]:hover {
			border-bottom: 2px solid #3B4161;
		}
		
		.email-signup button[type="submit"] {
			background-color: #3B4161;
			color: #F7F7F7;
			border: none;
			padding: 15px 30px;
			cursor: pointer;
			border-radius: 5px;
			box-shadow: 0 0 10px #3B4161;
			transition: transform 0.2s ease;
		}
		
		.email-signup button[type="submit"]:hover {
			transform: scale(1.1);
			box-shadow: 0 0 20px #3B4161;
		}
		
		@keyframes loading {
			from {
				background-color: #3B4161;
				transform: scale(1);
			}
			to {
				background-color: #F7F7F7;
				transform: scale(1.2);
			}
		}
		
		@keyframes success {
			from {
				background-color: #3B4161;
			}
			to {
				background-color: #F7F7F7;
			}
		}
		
		.loader {
			margin: 20px auto;
			padding: 20px;
			width: 50px;
			height: 50px;
			border-radius: 50%;
			background-color: #3B4161;
			animation: loading 1s infinite;
		}
		
		.loader-success {
			animation: success 1s;
		}
		
		.loader-container {
			position: relative;
		}
		
		.loader-container::before {
			content: "";
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			width: 20px;
			height: 20px;
			background-color: #F7F7F7;
			animation: loading 1s infinite;
		}
		
		.loader-container::after {
			content: "";
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			width: 40px;
			height: 40px;
			background-color: #F7F7F7;
			animation: loading 1s infinite;
		}

			margin: 20px auto;
			padding: 20px;

			color: #F7F7F7;
			text-align: center;
			clear: both;
		}
		
		.footer a {
			color: #F7F7F7;
			text-decoration: none;
		}
		
		.footer a:hover {
			color: #3B4161;
		}
		
		.footer ul {
			list-style: none;
			margin: 0;
			padding: 0;
		}
		
		.footer li {
			display: inline-block;
			margin: 10px;
		}

			background-color: #3B4161;
			color: #F7F7F7;
			border-radius: 5px;
			transition: background-color 0.2s ease;
		}
